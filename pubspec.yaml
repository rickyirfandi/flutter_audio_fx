name: flutter_audio_fx
description: >-
  Real-time voice effects for Flutter powered by a Rust DSP core: auto-tune,
  pitch shift, noise suppression, EQ, reverb, de-esser and more.
version: 0.3.0
homepage: https://github.com/rickyirfandi/flutter_audio_fx
repository: https://github.com/rickyirfandi/flutter_audio_fx
issue_tracker: https://github.com/rickyirfandi/flutter_audio_fx/issues
screenshots:
  - description: flutter_audio_fx package icon
    path: doc/images/icon.png

topics:
  - audio
  - dsp
  - effects
  - rust
  - ffi

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
        package: dev.flutter_audio_fx
        pluginClass: FlutterAudioFxPlugin
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
