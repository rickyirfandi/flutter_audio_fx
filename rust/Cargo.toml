[package]
name = "flutter_audio_fx_core"
version = "0.4.0"
edition = "2021"
rust-version = "1.83"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
cpal = "0.15"
rustfft = "6.2"
nnnoiseless = { version = "0.5", default-features = false }
ringbuf = "0.4"
hound = "3.5"
log = "0.4"
arc-swap = "1.7"
once_cell = "1.19"
realfft = "3.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(target_os = "ios")'.dependencies]
oslog = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
# A panic unwinding across the C ABI is UB; abort instead (release already
# does). Cargo ignores this for test targets, so `cargo test` still works.
panic = "abort"

[[test]]
name = "effects"
path = "tests/effects.rs"

[[test]]
name = "api"
path = "tests/api.rs"
