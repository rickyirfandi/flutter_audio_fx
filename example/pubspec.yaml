name: voxforge
description: Audio recording app with real-time DSP effects powered by Rust.
publish_to: 'none'

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_audio_fx:
    path: ../
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
