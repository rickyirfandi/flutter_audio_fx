name: Build native cores

# Builds the Rust core for every platform and commits the binaries into the
# repo (ironpress-style), so package consumers just `pub get` and run — no
# Rust toolchain required. Full builds run on version tags and manual
# dispatch; pushes/PRs to master run the test jobs only. The bot commit lands
# on the default branch for tags, or on the dispatched branch otherwise, and
# does not re-trigger a build (tags/dispatch only).

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.88.0"
  FLUTTER_VERSION: "3.29.0"

defaults:
  run:
    shell: bash

concurrency:
  group: build-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────── Tests (every trigger) ───────────────────────
  test-rust:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }}
          rustup default ${{ env.RUST_VERSION }}
      - name: ALSA dev headers (cpal dependency)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - working-directory: rust
        run: cargo test --release

  test-dart:
    name: flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test

      - name: Install Rust for Dart FFI integration tests
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }}
          rustup default ${{ env.RUST_VERSION }}
          sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Build current source for Dart FFI tests
        run: cargo build --locked --manifest-path rust/Cargo.toml
      - name: Test Dart bindings and export worker isolate
        env:
          FLUTTER_AUDIO_FX_NATIVE_TESTS: '1'
        run: |
          LD_LIBRARY_PATH="$PWD/rust/target/debug${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            flutter test test/native_engine_test.dart

  # ─────────────────────────── Android ───────────────────────────
  build-android:
    name: Android (arm64 / armv7 / x86_64)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Install Rust + Android targets
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }}
          rustup default ${{ env.RUST_VERSION }}
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build .so per ABI
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        working-directory: rust
        run: |
          cargo ndk \
            -t aarch64-linux-android \
            -t armv7-linux-androideabi \
            -t x86_64-linux-android \
            -o ../android/src/main/jniLibs \
            build --release

      - uses: actions/upload-artifact@v4
        with:
          name: native-android
          path: android/src/main/jniLibs/
          if-no-files-found: error

  # ──────────────────────────── iOS ──────────────────────────────
  build-ios:
    name: iOS xcframework (device + simulator)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + iOS targets
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }}
          rustup default ${{ env.RUST_VERSION }}
          rustup target add \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios

      - name: Build static libs for each iOS target
        working-directory: rust
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "13.0"
        run: |
          cargo build --release --target aarch64-apple-ios
          cargo build --release --target aarch64-apple-ios-sim
          cargo build --release --target x86_64-apple-ios

      - name: Assemble xcframework
        run: |
          # Cargo's `strip = true` doesn't reach static archives: they still
          # carry the precompiled std's debug info (~20 MB per slice).
          # `strip -S` drops debug symbols only; exported fx_* stay intact.
          for t in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios; do
            strip -S rust/target/$t/release/libflutter_audio_fx_core.a
          done
          mkdir -p stage/ios build/sim
          lipo -create \
            rust/target/aarch64-apple-ios-sim/release/libflutter_audio_fx_core.a \
            rust/target/x86_64-apple-ios/release/libflutter_audio_fx_core.a \
            -output build/sim/libflutter_audio_fx_core.a
          xcodebuild -create-xcframework \
            -library rust/target/aarch64-apple-ios/release/libflutter_audio_fx_core.a \
            -library build/sim/libflutter_audio_fx_core.a \
            -output stage/ios/flutter_audio_fx_core.xcframework

      - uses: actions/upload-artifact@v4
        with:
          name: native-ios
          path: stage/ios/
          if-no-files-found: error

  # ─────────────────────────── macOS ─────────────────────────────
  build-macos:
    name: macOS universal (arm64 + x86_64)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + macOS targets
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }}
          rustup default ${{ env.RUST_VERSION }}
          rustup target add \
            aarch64-apple-darwin \
            x86_64-apple-darwin

      - name: Build + lipo universal .a
        working-directory: rust
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p ../stage/macos
          lipo -create \
            target/aarch64-apple-darwin/release/libflutter_audio_fx_core.a \
            target/x86_64-apple-darwin/release/libflutter_audio_fx_core.a \
            -output ../stage/macos/libflutter_audio_fx_core.a
          # Drop debug info (see iOS job); keeps the package under pub's limit.
          strip -S ../stage/macos/libflutter_audio_fx_core.a

      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: stage/macos/
          if-no-files-found: error

  # ─────────────────────────── Linux ─────────────────────────────
  build-linux:
    name: Linux x86_64
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }}
          rustup default ${{ env.RUST_VERSION }}

      - name: ALSA dev headers (cpal dependency)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Build
        working-directory: rust
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: rust/target/release/libflutter_audio_fx_core.so
          if-no-files-found: error

  # ────────────────────────── Windows ────────────────────────────
  build-windows:
    name: Windows x86_64
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }}
          rustup default ${{ env.RUST_VERSION }}

      - name: Build
        working-directory: rust
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: rust/target/release/flutter_audio_fx_core.dll
          if-no-files-found: error

  # ── Assemble, validate, and commit binaries back to the repo ──
  package:
    name: Commit precompiled binaries
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-android, build-ios, build-macos, build-linux, build-windows, test-rust, test-dart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Check out the exact commit that was built, so binaries are never
      # committed on top of different source.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble binaries into plugin folders
        run: |
          # Android: cargo-ndk already laid out <abi>/libflutter_audio_fx_core.so
          mkdir -p android/src/main/jniLibs
          cp -R artifacts/native-android/* android/src/main/jniLibs/

          # iOS: xcframework (device + simulator slices)
          rm -rf ios/flutter_audio_fx_core.xcframework
          cp -R artifacts/native-ios/flutter_audio_fx_core.xcframework ios/

          # macOS: universal static lib (podspec vendored_libraries)
          cp artifacts/native-macos/libflutter_audio_fx_core.a macos/

          # Linux: prebuilt .so picked up by linux/CMakeLists.txt
          cp artifacts/native-linux/libflutter_audio_fx_core.so linux/

          # Windows: prebuilt .dll picked up by windows/CMakeLists.txt
          cp artifacts/native-windows/flutter_audio_fx_core.dll windows/

      - name: Verify structure
        run: |
          echo "=== Android ===" && find android/src/main/jniLibs -type f | sort
          echo "=== iOS ==="     && find ios/flutter_audio_fx_core.xcframework -type f -exec ls -lh {} +
          echo "=== macOS ==="   && ls -lh macos/libflutter_audio_fx_core.a
          echo "=== Linux ==="   && ls -lh linux/libflutter_audio_fx_core.so
          echo "=== Windows ===" && ls -lh windows/flutter_audio_fx_core.dll

      # Commit before validating: `pub publish --dry-run` fails on modified
      # tracked files, which updated binaries always are. Validation then
      # runs on the exact tree that will be pushed; nothing is pushed if it
      # fails.
      - name: Commit precompiled binaries
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f android/src/main/jniLibs/ ios/flutter_audio_fx_core.xcframework/ \n            macos/libflutter_audio_fx_core.a linux/libflutter_audio_fx_core.so \n            windows/flutter_audio_fx_core.dll

          if git diff --cached --quiet; then
            echo "No changes — binaries are already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update precompiled native binaries

          Built from ${GITHUB_SHA::8} via CI (${{ github.ref_name }}).
          Platforms: Android (arm64-v8a, armeabi-v7a, x86_64), iOS
          (xcframework), macOS (universal .a), Linux (x64),
          Windows (x64)."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Validate package
        run: |
          flutter pub get
          git checkout -- example/
          flutter analyze lib test
          flutter test
          flutter pub publish --dry-run

      - name: Push precompiled binaries
        if: steps.commit.outputs.changed == 'true'
        run: |
          # Tags publish to the default branch (fails if it has moved past
          # the tagged commit — re-tag rather than mix code and binaries);
          # branch dispatches push back to the branch that was built.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            target="${{ github.event.repository.default_branch }}"
          else
            target="${{ github.ref_name }}"
          fi
          git push origin HEAD:"$target"
          echo "Precompiled binaries committed and pushed."

      # ── On tags: attach per-platform zips to a GitHub Release ──
      - name: Zip per-platform bundles for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          zip -r dist/flutter_audio_fx_android.zip android/src/main/jniLibs
          zip -r dist/flutter_audio_fx_ios.zip ios/flutter_audio_fx_core.xcframework
          zip -r dist/flutter_audio_fx_macos.zip macos/libflutter_audio_fx_core.a
          zip -r dist/flutter_audio_fx_linux.zip linux/libflutter_audio_fx_core.so
          zip -r dist/flutter_audio_fx_windows.zip windows/flutter_audio_fx_core.dll

      - name: Create / update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
